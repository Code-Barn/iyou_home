name: Build Windows Executable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach .exe to (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # SEC-002: no TLS key material is staged for the build. The release
      # binary embeds zero private key material — it generates an ephemeral
      # in-memory self-signed authority at runtime, or loads an
      # operator-provisioned `{app_data}/certs/production.{crt,key}` pair from
      # the user's local app data directory. Staging PRODUCTION_KEY_B64 here
      # used to be the vector that baked the production key into the shipped
      # .exe, extractable with `strings`. This step is a guard, not a
      # provisioner.
      - name: Assert No Key Material Is Staged (SEC-002)
        shell: bash
        run: |
          if ls src-tauri/certs/*.key src-tauri/certs/*.pem 1>/dev/null | grep -q .; then
            echo "SEC-002 violation: private key material present in src-tauri/certs/ before build"
            exit 1
          fi
          echo "SEC-002: no key material staged; build will use an ephemeral in-memory authority"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Windows Executable
        run: npm run tauri build -- --bundles nsis

      - name: Verify Release Binary Contains No Private Key (SEC-002)
        shell: bash
        run: |
          # Defence in depth: scan the compiled artifact for an actual PEM
          # private-key BLOCK (header immediately followed by a base64 body).
          # A bare "BEGIN PRIVATE KEY" tag can legitimately appear as a
          # library constant; a header + body can only come from embedded
          # key material.
          ARTIFACT=$(ls src-tauri/target/release/iyou-home.exe 2>/dev/null || true)
          if [ -z "$ARTIFACT" ]; then
            echo "SEC-002: release binary not found at expected path; skipping scan"
            exit 0
          fi
          if strings "$ARTIFACT" | grep -A1 -i "BEGIN PRIVATE KEY" \
               | grep -qE '^[A-Za-z0-9+/]{32,}={0,2}$'; then
            echo "SEC-002 VIOLATION: PEM private-key block found in $ARTIFACT"
            exit 1
          fi
          echo "SEC-002: no PEM private-key block in $(basename "$ARTIFACT")"

      - name: Locate & Hash Executable
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release-artifacts/ 2>/dev/null || cp src-tauri/target/release/bundle/nsis/*.exe release-artifacts/
          cd release-artifacts
          sha256sum *.exe > SHA256SUMS_WINDOWS.txt
          cat SHA256SUMS_WINDOWS.txt

      - name: Upload .exe to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || 'v0.2.0' }}"
          gh release upload "$TAG" release-artifacts/*.exe release-artifacts/SHA256SUMS_WINDOWS.txt --clobber
