name: Build Windows Executable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach .exe to (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Stage Production Certificates
        shell: bash
        env:
          PROD_CRT_B64: ${{ secrets.PRODUCTION_CRT_B64 }}
          PROD_KEY_B64: ${{ secrets.PRODUCTION_KEY_B64 }}
        run: |
          mkdir -p src-tauri/certs
          if [ -n "$PROD_CRT_B64" ] && [ -n "$PROD_KEY_B64" ]; then
            echo "$PROD_CRT_B64" | base64 -d > src-tauri/certs/production.crt
            echo "$PROD_KEY_B64" | base64 -d > src-tauri/certs/production.key
          else
            echo "Generating self-signed fallback certs for home.iyou.me"
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout src-tauri/certs/production.key -out src-tauri/certs/production.crt -days 365 -nodes -subj "/CN=home.iyou.me"
          fi

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Windows Executable
        run: npm run tauri build -- --bundles nsis

      - name: Locate & Hash Executable
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release-artifacts/ 2>/dev/null || cp src-tauri/target/release/bundle/nsis/*.exe release-artifacts/
          cd release-artifacts
          sha256sum *.exe > SHA256SUMS_WINDOWS.txt
          cat SHA256SUMS_WINDOWS.txt

      - name: Upload .exe to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || 'v0.2.0' }}"
          gh release upload "$TAG" release-artifacts/*.exe release-artifacts/SHA256SUMS_WINDOWS.txt --clobber
